[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rocrate-studio"
version = "0.1.0"
description = "Local point-and-click GUI for building RO-Crates with fairscape_conversion, fairscape_models and nf-fairscape"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "pyyaml", "fairscape-models", "fairscape-conversion"]

[project.scripts]
rocrate-studio = "rocrate_studio.__main__:main"

[tool.setuptools]
packages = ["rocrate_studio"]
include-package-data = true

[tool.setuptools.package-data]
rocrate_studio = ["static/*"]
